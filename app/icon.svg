<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <!-- Red base (stripes 1, 3, 5) -->
  <rect width="900" height="600" fill="#CE1126"/>
  <!-- White stripes (2 and 4) -->
  <rect y="120" width="900" height="120" fill="#FFFFFF"/>
  <rect y="360" width="900" height="120" fill="#FFFFFF"/>
  <!-- Blue equilateral triangle: base = full height (600), apex at 600*(√3/2)≈519.6 -->
  <polygon points="0,0 0,600 519.6,300" fill="#0032A0"/>
  <!-- White 5-pointed star: centroid of triangle = (173.2, 300), R=90, r=34.4 -->
  <polygon
    points="173.2,210 193.4,272.2 258.8,272.2 205.9,310.6 226.1,372.8 173.2,334.4 120.3,372.8 140.5,310.6 87.6,272.2 153.0,272.2"
    fill="#FFFFFF"
  />
</svg>
